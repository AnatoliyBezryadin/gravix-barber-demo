<title>GRAVIX — закрытый доступ</title>
<style>
:root{--g:#093A30;--gold:#C49C5E;--bd:#1E5749;--cream:#F3EEE3;}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:linear-gradient(160deg,#061310,#093A30);color:var(--cream);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;min-height:100vh}
.box{width:100%;max-width:360px;text-align:center}
.brand{font-weight:800;letter-spacing:.18em;font-size:32px}.brand b{color:var(--gold)}
.sub{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin:6px 0 30px}
.lead{font-size:14px;color:#9fb3ab;line-height:1.6;margin-bottom:22px}
form{display:flex;flex-direction:column;gap:12px}
input{padding:15px 16px;border:1px solid var(--bd);background:rgba(6,19,16,.5);color:var(--cream);font-size:15px;border-radius:4px;outline:none;text-align:center;letter-spacing:.04em}
input:focus{border-color:var(--gold)}
button{padding:15px;border:none;background:var(--gold);color:#0A2A22;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:13px;border-radius:4px;cursor:pointer}
button:hover{filter:brightness(1.06)}
.err{color:#e6a3a3;font-size:13px;min-height:18px}
.foot{margin-top:26px;font-size:11px;color:#5f7f75;letter-spacing:.08em}
</style></head>
