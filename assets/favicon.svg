<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="GRAVIX">
  <rect width="64" height="64" rx="14" fill="#093A30"/>
  <!-- compass ring -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#1E5749" stroke-width="2"/>
  <!-- cardinal ticks -->
  <g stroke="#7FA294" stroke-width="2" stroke-linecap="round">
    <line x1="32" y1="13" x2="32" y2="17"/>
    <line x1="32" y1="47" x2="32" y2="51"/>
    <line x1="13" y1="32" x2="17" y2="32"/>
    <line x1="47" y1="32" x2="51" y2="32"/>
  </g>
  <!-- signature GRAVIX needle: gold top, cream bottom -->
  <polygon points="32,12 39,32 32,32 25,32" fill="#C49C5E"/>
  <polygon points="32,52 39,32 32,32 25,32" fill="#E3DED4"/>
  <circle cx="32" cy="32" r="2.6" fill="#093A30" stroke="#C49C5E" stroke-width="1.4"/>
</svg>
